<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de Mii articulado</title><style>body{margin:0;background:#23392e;color:white;font:16px system-ui}header{padding:12px}button{padding:9px;margin:3px}canvas{display:block;width:100%;height:75vh}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><header><strong>Prototipo articulado · Eric</strong><p>Elige una animación; arrastra para girar la cámara.</p><div id="controls"></div></header><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createMii} from './simulation/mii-rig.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb6d998);
const camera=new THREE.PerspectiveCamera(40,innerWidth/(innerHeight*.75),.1,100);camera.position.set(3,2.5,4);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight*.75);document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,6,4);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0x87a776}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const avatar=createMii({faceUrl:'./caras/eric.png'});scene.add(avatar.root);
const seat=new THREE.Group(),wood=new THREE.MeshStandardMaterial({color:0x89694e});function box(w,h,d,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wood);mesh.position.set(x,y,z);seat.add(mesh)}
box(.75,.12,.7,0,.35,-.1);box(.75,.6,.1,0,.65,-.42);for(const x of [-.28,.28])for(const z of [-.32,.12])box(.08,.35,.08,x,.17,z);scene.add(seat);seat.visible=false;
let mode='idle';for(const [id,label] of [['idle','Reposo'],['walk','Caminar'],['sit','Sentarse'],['eat','Comer'],['study','Estudiar'],['computer','Ordenador']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{mode=id;avatar.play(id);seat.visible=!['idle','walk'].includes(id)};document.querySelector('#controls').append(b)}
let previous=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-previous)/1000);previous=now;avatar.mixer.update(dt);avatar.root.position.y+=((seat.visible?-.18:0)-avatar.root.position.y)*Math.min(1,dt*6);controls.update();renderer.render(scene,camera)}requestAnimationFrame(tick);
</script></body></html>
